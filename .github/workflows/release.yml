name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Compute versionCode: major*10000 + minor*100 + patch
          IFS='.' read -r major minor patch <<< "${VERSION}"
          CODE=$(( major * 10000 + minor * 100 + (patch + 0) ))
          echo "code=${CODE}" >> $GITHUB_OUTPUT
          echo "Building release ${VERSION} (code=${CODE})"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ steps.version.outputs.code }}
          --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "NovaVPN-${VERSION}-debug.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NovaVPN ${{ steps.version.outputs.version }}"
          body: |
            ## NovaVPN ${{ steps.version.outputs.version }}

            ### Changes
            - **Fixed:** Logs screen now shows past logs (SharedFlow replay fix)
            - **Fixed:** DNS_PROBE_POSSIBLE (port 53 routing)
            - **Fixed:** Notification permission on Android 13+
            - **Fixed:** Dark mode theme selector now works
            - **Added:** DIAG logging — TUN fd alive check every 5s

            ### Download
            - **Debug APK**: `NovaVPN-${{ steps.version.outputs.version }}-debug.apk`

            ### Notes
            This is a **pre-release** build. Not intended for production use.
          files: NovaVPN-*.apk
          prerelease: true
          draft: false
