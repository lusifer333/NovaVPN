name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Install NDK
        run: |
          yes | ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" 2>&1 | tail -3

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Compute versionCode: major*10000 + minor*100 + patch
          IFS='.' read -r major minor patch <<< "${VERSION}"
          CODE=$(( major * 10000 + minor * 100 + (patch + 0) ))
          echo "code=${CODE}" >> $GITHUB_OUTPUT
          echo "Building release ${VERSION} (code=${CODE})"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Download engine binaries
        run: |
          chmod +x scripts/download-engines.sh
          # Automatic: build arm64 only, unless tag contains 'armv7' → armv7 only.
          if [[ "${GITHUB_REF_NAME}" == *armv7* ]]; then
            echo "ARMV7=true" >> "$GITHUB_ENV"
            scripts/download-engines.sh armeabi-v7a
          else
            echo "ARMV7=false" >> "$GITHUB_ENV"
            scripts/download-engines.sh arm64-v8a
          fi
          echo "Engine binaries:"
          ls -la app/src/main/jniLibs/**/ 2>/dev/null || ls -la app/src/main/jniLibs/

      - name: Build Release APK
        run: |
          ./gradlew assembleDebug assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -Parmv7="${{ env.ARMV7 }}" \
            --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "NovaVPN-${VERSION}-debug.apk"
          # Minified (R8) release build — smaller APK + lower RAM footprint,
          # the right artifact for low-end devices.
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
              "NovaVPN-${VERSION}-release.apk"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Fetch tags so we can find the previous one
          git fetch --tags --force 2>/dev/null || true
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # Find previous tag in reverse semver order
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "untagged" | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            PREV_TAG=""
          fi
          echo "current=${CURRENT_TAG}" >> $GITHUB_OUTPUT
          echo "previous=${PREV_TAG}" >> $GITHUB_OUTPUT

          # Generate changelog from commit messages
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..${CURRENT_TAG}" 2>/dev/null || echo "")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log --oneline --no-merges -10 "${CURRENT_TAG}" 2>/dev/null || echo "Initial release")
          fi

          # Format as markdown list
          FORMATTED=""
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              # Strip commit hash
              clean=$(echo "$line" | sed 's/^[a-f0-9]\{7,9\} //')
              FORMATTED="${FORMATTED}- ${clean}"$'\n'
            fi
          done <<< "$CHANGELOG"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "## NovaVPN ${CURRENT_TAG#v}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Changes" >> $GITHUB_OUTPUT
          echo "${FORMATTED}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Download" >> $GITHUB_OUTPUT
          echo "- **Debug APK**: \`NovaVPN-${CURRENT_TAG#v}-debug.apk\`" >> $GITHUB_OUTPUT
          echo "- **Release APK (R8/minified, recommended for low-end devices)**: \`NovaVPN-${CURRENT_TAG#v}-release.apk\`" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Notes" >> $GITHUB_OUTPUT
          echo "This is a **pre-release** build. Not intended for production use." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Write body to file to avoid multi-line output issues
          {
            echo "## NovaVPN ${CURRENT_TAG#v}"
            echo ""
            echo "### Changes"
            echo "${FORMATTED}"
            echo ""
            echo "### Download"
            echo "- **Debug APK**: \`NovaVPN-${CURRENT_TAG#v}-debug.apk\`"
            echo "- **Release APK (R8/minified, recommended for low-end devices)**: \`NovaVPN-${CURRENT_TAG#v}-release.apk\`"
            echo ""
            echo "### Notes"
            echo "This is a **pre-release** build. Not intended for production use."
          } > /tmp/release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NovaVPN ${{ steps.version.outputs.version }}"
          body_path: /tmp/release-body.md
          files: NovaVPN-*.apk
          prerelease: true
          draft: false
